.language-popup{

  align-items:center;

  z-index:99999;

}

.language-box{
  width:90%;

  background:#fff;
  padding:32px 25px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.30);

}

@keyframes popIn{
  from{opacity:0;transform:scale(.94)}
  to{opacity:1;transform:scale(1)}
}

.language-icon{font-size:42px;margin-bottom:8px}
.language-box h2{margin:5px 0 6px;font-size:25px}

.language-box button{

  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}
.language-box button:first-of-type{background:#ff3b3b}

.language-switcher{

      el.innerHTML="Expired";

})();

<script>
function updateLanguageUI(lang){
  document.querySelectorAll('[data-en]').forEach(function(el){
    var value = lang === 'ta' ? el.getAttribute('data-ta') : el.getAttribute('data-en');
    if(value !== null) el.innerHTML = value;
  });

  document.documentElement.lang = lang === 'ta' ? 'ta' : 'en';

  var taBtn = document.getElementById('langTa');
  var enBtn = document.getElementById('langEn');

  if(taBtn && enBtn){
    taBtn.classList.toggle('active', lang === 'ta');
    enBtn.classList.toggle('active', lang === 'en');
  }
}

function selectLanguage(lang){
  updateLanguageUI(lang);

  localStorage.setItem('freeclassLanguage', lang);

  var popup = document.getElementById('languagePopup');
  if(popup) popup.style.display = 'none';
}

document.addEventListener('DOMContentLoaded', function(){

  var savedLanguage = localStorage.getItem('freeclassLanguage');

  if(savedLanguage === 'ta' || savedLanguage === 'en'){
    updateLanguageUI(savedLanguage);
    document.getElementById('languagePopup').style.display = 'none';
  }else{
    updateLanguageUI('ta');
    document.getElementById('languagePopup').style.display = 'flex';
  }

});
</script>
