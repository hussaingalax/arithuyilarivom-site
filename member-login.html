<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script></head><body><header class="topbar"><div class="container topbar-inner"><div class="brand" data-i18n="brand">Arithuyil Arivom</div><div class="lang"><button data-lang="en">EN</button><button data-lang="ta">தமிழ்</button></div></div></header><main class="dashboard"><div class="container" style="max-width:520px"><div class="card"><h1 data-i18n="login">Member Login</h1><p class="muted" data-i18n="loginHint">Your account is created after successful payment.</p><div id="msg"></div><form id="loginForm"><div class="field"><label data-i18n="mobile">Mobile Number</label><input class="input" id="mobile" inputmode="numeric" maxlength="10" required></div><div class="field"><label data-i18n="password">Password</label><input class="input" id="password" type="password" required></div><button class="cta full" data-i18n="loginBtn">Login</button></form><div style="margin-top:15px;text-align:center"><a class="pill" href="pournami.html">← Back to Program</a></div></div></div></main><script>
const sb=window.supabase.createClient(MEDITATION_CONFIG.SUPABASE_URL,MEDITATION_CONFIG.SUPABASE_ANON_KEY);function msg(x,ok=false){document.getElementById('msg').innerHTML=`<div class="status ${ok?'success':'error'}">${x}</div>`}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const mobile=document.getElementById('mobile').value.trim(),password=document.getElementById('password').value;if(!/^\d{10}$/.test(mobile)){msg(t('invalidMobile'));return}const email=`${mobile}@member.arithuyilarivom.com`;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg(error.message);return}localStorage.setItem('aa_member_mobile',mobile);location.href='member-dashboard.html'});setLang(currentLang);
</script></body></html>
