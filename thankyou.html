<script>

    // ==========================================
    // GET REGISTRATION DETAILS
    // ==========================================

    const registrationNo =
        sessionStorage.getItem(
            "registration_no"
        );

    const registrationId =
        sessionStorage.getItem(
            "registration_id"
        );

    const paymentId =
        sessionStorage.getItem(
            "razorpay_payment_id"
        );

    const customerName =
        sessionStorage.getItem(
            "customer_name"
        );

    const customerMobile =
        sessionStorage.getItem(
            "customer_mobile"
        );

    const customerLocation =
        sessionStorage.getItem(
            "customer_location"
        );

    const customerClassMode =
        sessionStorage.getItem(
            "customer_class_mode"
        );


    // ==========================================
    // DISPLAY REGISTRATION NUMBER
    // ==========================================

    const registrationNumberElement =
        document.getElementById(
            "registrationNumber"
        );


    if (registrationNo) {

        registrationNumberElement.innerText =
            "Registration No: " +
            registrationNo;

    } else {

        registrationNumberElement.innerText =
            "Registration Confirmed";

    }


    // ==========================================
    // CLASS MODE TEXT
    // ==========================================

    let classModeText =
        "Online";

    if (
        customerClassMode === "offline"
    ) {

        classModeText =
            "Offline – Chennai";

    } else {

        classModeText =
            "Online – Zoom";

    }


    // ==========================================
    // WHATSAPP MESSAGE
    // ==========================================

    let message =
        "Hello Arithuyil Arivom,%0A%0A" +

        "I have successfully registered " +
        "for the Free Experience Class " +
        "and completed the ₹199 payment." +

        "%0A%0A" +

        "Registration Details:" +

        "%0AName: " +
        encodeURIComponent(
            customerName || ""
        ) +

        "%0ARegistered Mobile: " +
        encodeURIComponent(
            customerMobile || ""
        ) +

        "%0ALocation: " +
        encodeURIComponent(
            customerLocation || ""
        ) +

        "%0AClass Mode: " +
        encodeURIComponent(
            classModeText
        );


    if (registrationNo) {

        message +=
            "%0ARegistration No: " +
            encodeURIComponent(
                registrationNo
            );

    }


    if (paymentId) {

        message +=
            "%0APayment ID: " +
            encodeURIComponent(
                paymentId
            );

    }


    message +=
        "%0A%0APlease confirm my Free Class seat.";


    // ==========================================
    // WHATSAPP
    // ==========================================

    const whatsappNumber =
        "919840851295";


    const whatsappUrl =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        message;


    // ==========================================
    // WHATSAPP BUTTON
    // ==========================================

    const whatsappButton =
        document.getElementById(
            "whatsappButton"
        );


    whatsappButton.href =
        whatsappUrl;


    // ==========================================
    // AUTO REDIRECT
    // ==========================================

    setTimeout(function () {

        window.location.href =
            whatsappUrl;

    }, 3000);

</script>
