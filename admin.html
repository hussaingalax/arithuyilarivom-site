<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Admin Panel</title>

<style>
body{font-family:Arial;background:#f5f7fb;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
button{padding:8px 14px;margin:4px}
input{padding:8px;margin:6px}
</style>
</head>

<body>

<div id="loginCard" class="card">
<h2>Admin Login</h2>
<input id="pin" placeholder="Enter 4 digit PIN">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none">

<div class="card">
<h3>Dashboard Summary</h3>
<div id="stats">Loading...</div>
</div>

<div class="card">
<h3>Leads</h3>
<div id="leads"></div>
</div>

<div class="card">
<h3>Payments</h3>
<div id="payments"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
"https://pryfnuknwbnerqgiwnmk.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByeWZudWtud2JuZXJxZ2l3bm1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3MzI5MjYsImV4cCI6MjA4NjMwODkyNn0.N0rcOIERLUjv_tiE6ofIa1LMGUSLrNb4hWHeWFzCbDs"
);

const MAX_SEATS = 100;
let currentRole="";

async function login(){

let pin=document.getElementById("pin").value;

let {data,error}=await supabaseClient
.from("admin_users")
.select("*")
.eq("pin",pin)
.single();

if(data){
currentRole=data.role;
document.getElementById("loginCard").style.display="none";
document.getElementById("dashboard").style.display="block";
loadLeads();
loadPayments();
loadStats();
}else{
alert("Wrong PIN");
}
}

async function loadLeads(){
let {data}=await supabaseClient.from("freeclass_registrations").select("*");

let html="";
data.forEach(x=>{
html+=`${x.name} - ${x.mobile}<br>`;
});
document.getElementById("leads").innerHTML=html;
}

async function loadPayments(){
let {data}=await supabaseClient.from("payments").select("*");

let html="";
data.forEach(x=>{
html+=`${x.name} - ${x.utr} - ${x.status}
<button onclick="markPaid('${x.id}','${x.mobile}','${x.name}')">Verify & Assign Seat</button><br>`;
});
document.getElementById("payments").innerHTML=html;
}

async function markPaid(id,mobile,name){

let {data:lastSeat} = await supabaseClient
.from("payments")
.select("seat_no")
.eq("status","paid")
.order("seat_no",{ascending:false})
.limit(1);

let nextSeat = 1;
if(lastSeat.length>0){
nextSeat = (lastSeat[0].seat_no || 0) + 1;
}

await supabaseClient.from("payments")
.update({status:"paid", seat_no: nextSeat})
.eq("id",id);

window.open(
`https://wa.me/91${mobile}?text=Hello ${name}, Your seat ${nextSeat} is confirmed for Arithuyil Arivom class.`,
"_blank");

loadPayments();
loadStats();
}

async function loadStats(){

let {data:leads}=await supabaseClient.from("freeclass_registrations").select("*");
let {data:payments}=await supabaseClient.from("payments").select("*");

let totalLeads = leads.length;
let paid = payments.filter(x=>x.status=="paid").length;
let revenue = 0;

payments.forEach(x=>{
if(x.status=="paid") revenue += Number(x.amount||0);
});

let remaining = MAX_SEATS - paid;

document.getElementById("stats").innerHTML =
`
Total Leads : ${totalLeads}<br>
Paid Seats : ${paid}<br>
Remaining Seats : ${remaining}<br>
Total Revenue : ₹${revenue}
`;
}

</script>

</body>
</html>
