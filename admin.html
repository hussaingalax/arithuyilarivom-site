<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Admin Panel</title>

<style>
body{font-family:Arial;background:#f5f7fb;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
button{padding:8px 14px;margin:4px}
input{padding:8px;margin:6px}
</style>
</head>

<body>

<div id="loginCard" class="card">
<h2>Admin Login</h2>
<input id="pin" placeholder="Enter 4 digit PIN">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none">

<div class="card">
<h3>Dashboard Summary</h3>
<div id="stats">Loading...</div>
</div>

<div class="card">
<h3>Leads</h3>
<div id="leads"></div>
</div>

<div class="card">
<h3>Payments</h3>
<div id="payments"></div>
</div>

<div class="card">
<h3>Create Sub User</h3>
<input id="uname" placeholder="Name">
<input id="upin" placeholder="PIN">
<button onclick="createUser()">Create</button>
</div>

<div class="card">
<h3>Export Report</h3>
<button onclick="exportCSV()">Download Excel</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
"YOUR_PROJECT_URL",
"YOUR_ANON_KEY"
);

const MAX_SEATS = 100;
let currentRole="";

async function login(){

let pin=document.getElementById("pin").value;

let {data}=await supabase
.from("admin_users")
.select("*")
.eq("pin",pin)
.single();

if(data){
currentRole=data.role;
document.getElementById("loginCard").style.display="none";
document.getElementById("dashboard").style.display="block";
loadLeads();
loadPayments();
loadStats();
}else{
alert("Wrong PIN");
}
}

async function loadLeads(){
let {data}=await supabase.from("freeclass_registrations").select("*");

let html="";
data.forEach(x=>{
html+=`${x.name} - ${x.mobile}<br>`;
});
document.getElementById("leads").innerHTML=html;
}

async function loadPayments(){

let {data}=await supabase.from("payments").select("*");

let html="";
data.forEach(x=>{
html+=`${x.name} - ${x.utr} - ${x.status}
<button onclick="markPaid('${x.id}','${x.mobile}','${x.name}')">Verify & Assign Seat</button><br>`;
});
document.getElementById("payments").innerHTML=html;
}

async function markPaid(id,mobile,name){

let {data:lastSeat} = await supabase
.from("payments")
.select("seat_no")
.eq("status","paid")
.order("seat_no",{ascending:false})
.limit(1);

let nextSeat = 1;
if(lastSeat.length>0){
nextSeat = (lastSeat[0].seat_no || 0) + 1;
}

await supabase.from("payments")
.update({status:"paid", seat_no: nextSeat})
.eq("id",id);

window.open(
`https://wa.me/91${mobile}?text=Hello ${name}, Your seat ${nextSeat} is confirmed for Arithuyil Arivom class.`,
"_blank");

alert("Seat assigned: "+nextSeat);

loadPayments();
loadStats();
}

async function loadStats(){

let {data:leads}=await supabase.from("freeclass_registrations").select("*");
let {data:payments}=await supabase.from("payments").select("*");

let totalLeads = leads.length;
let paid = payments.filter(x=>x.status=="paid").length;
let revenue = 0;

payments.forEach(x=>{
if(x.status=="paid") revenue += Number(x.amount||0);
});

let remaining = MAX_SEATS - paid;

document.getElementById("stats").innerHTML =
`
Total Leads : ${totalLeads}<br>
Paid Seats : ${paid}<br>
Remaining Seats : ${remaining}<br>
Total Revenue : ₹${revenue}
`;
}

async function createUser(){

if(currentRole!="super"){
alert("Only super admin allowed");
return;
}

let name=document.getElementById("uname").value;
let pin=document.getElementById("upin").value;

await supabase.from("admin_users")
.insert({name:name,role:"staff",pin:pin});

alert("User created");
}

async function exportCSV(){
let {data}=await supabase.from("freeclass_registrations").select("*");

let csv="Name,Mobile,Location\n";
data.forEach(x=>{
csv+=`${x.name},${x.mobile},${x.location}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="report.csv";
a.click();
}

</script>

</body>
</html>
