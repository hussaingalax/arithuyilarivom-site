<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Complete Booking</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="i18n.js?v=20260922-2"></script>

</head>


<body>


<header class="topbar">

  <div class="container topbar-inner">

    <div
      class="brand"
      data-i18n="brand"
    >
      Arithuyil Arivom
    </div>


    <div class="lang">

      <button data-lang="en">
        EN
      </button>

      <button data-lang="ta">
        தமிழ்
      </button>

    </div>

  </div>

</header>



<main class="dashboard">

  <div class="container">

    <div class="two-col">


      <!-- =========================================
           PAYMENT CARD
      ========================================== -->

      <div class="card">


        <h1 data-i18n="payment">
          Continue to Payment
        </h1>


        <div
          id="summary"
          class="muted"
        ></div>


        <div class="countdown-bar">

          <div data-i18n="timer">
            Offer Timer
          </div>


          <div
            id="timer"
            class="timer"
          >
            05:00
          </div>

        </div>


        <button
          id="payBtn"
          class="cta full"
          style="margin-top:14px"
          data-i18n="payment"
        >
          Continue to Payment
        </button>


        <div id="msg"></div>


      </div>



      <!-- =========================================
           IMPORTANT
      ========================================== -->

      <div class="card">

        <h2 data-i18n="important">
          Important
        </h2>


        <p data-i18n="holdMessage">
          Your selected offer is held temporarily.
          Payment must be completed before the
          reservation expires.
        </p>

      </div>


    </div>

  </div>

</main>



<script>


/* =========================================
   SUPABASE
========================================= */

const sb =
  window.supabase.createClient(
    MEDITATION_CONFIG.SUPABASE_URL,
    MEDITATION_CONFIG.SUPABASE_ANON_KEY
  );



/* =========================================
   BOOKING ID
========================================= */

const bookingId =
  new URLSearchParams(location.search)
    .get('booking');



/* =========================================
   GLOBAL STATE
========================================= */

let booking = null;

let timer = null;



/* =========================================
   SHOW MESSAGE
========================================= */

function show(message, ok = true) {

  const el =
    document.getElementById('msg');

  if (!el) return;


  el.innerHTML = `
    <div class="status ${ok ? 'success' : 'error'}">
      ${message}
    </div>
  `;

}



/* =========================================
   RENDER BOOKING SUMMARY
========================================= */

function renderSummary() {

  if (!booking) return;


  const data = booking;


  const programTitle =
    currentLang === 'ta'
      ? (
          data.program?.title_ta ||
          data.program?.title_en ||
          ''
        )
      : (
          data.program?.title_en ||
          ''
        );


  const modeText =
    data.mode === 'online'

      ? (
          currentLang === 'ta'
            ? 'ஆன்லைன் • Zoom'
            : 'Online • Zoom'
        )

      : (
          currentLang === 'ta'
            ? 'நேரடி வகுப்பு • ஆதம்பாக்கம் மையம்'
            : 'Live • Adambakkam Centre'
        );


  const summary =
    document.getElementById('summary');


  if (!summary) return;


  summary.innerHTML = `

    <strong>
      ${programTitle}
    </strong>

    <br>

    ${modeText}

    <br>

    <span class="price">
      ₹${data.offer_price}
    </span>

  `;

}



/* =========================================
   DYNAMIC LANGUAGE RENDER
========================================= */

window.renderDynamic = function () {

  renderSummary();

};



/* =========================================
   LOAD BOOKING
========================================= */

async function init() {


  /* ---------------------------------
     Validate booking ID
  --------------------------------- */

  if (!bookingId) {

    show(

      currentLang === 'ta'

        ? 'செல்லுபடியாகும் பதிவு கிடைக்கவில்லை.'

        : 'Invalid booking.',

      false

    );

    return;

  }



  /* ---------------------------------
     Load booking
  --------------------------------- */

  const {
    data,
    error
  } = await sb.rpc(

    'get_meditation_booking',

    {
      p_booking_id:
        bookingId
    }

  );



  /* ---------------------------------
     Booking error
  --------------------------------- */

  if (error || !data) {

    console.error(
      'Booking load error:',
      error
    );


    show(

      currentLang === 'ta'

        ? 'பதிவு கிடைக்கவில்லை.'

        : 'Booking not found.',

      false

    );

    return;

  }



  /* ---------------------------------
     Save booking
  --------------------------------- */

  booking = data;



  /* ---------------------------------
     Render summary
  --------------------------------- */

  renderSummary();



  /* ---------------------------------
     Reservation expiry
  --------------------------------- */

  const expiry =
    new Date(
      data.reservation_expires_at
    ).getTime();


  startTimer(expiry);



  /* ---------------------------------
     Payment button
  --------------------------------- */

  const payBtn =
    document.getElementById('payBtn');


  if (payBtn) {

    payBtn.onclick =
      createOrder;

  }

}



/* =========================================
   TIMER
========================================= */

function startTimer(end) {


  /* ---------------------------------
     Clear previous timer
  --------------------------------- */

  clearInterval(timer);



  /* ---------------------------------
     Timer tick
  --------------------------------- */

  const tick = () => {


    const seconds =
      Math.max(

        0,

        Math.floor(
          (end - Date.now()) / 1000
        )

      );



    const timerEl =
      document.getElementById('timer');


    if (timerEl) {

      timerEl.textContent =

        `${String(
          Math.floor(seconds / 60)
        ).padStart(2, '0')}:${String(
          seconds % 60
        ).padStart(2, '0')}`;

    }



    /* ---------------------------------
       Expired
    --------------------------------- */

    if (seconds <= 0) {

      clearInterval(timer);


      const payBtn =
        document.getElementById('payBtn');


      if (payBtn) {

        payBtn.disabled = true;

      }


      show(

        currentLang === 'ta'

          ? 'இந்த சலுகைக்கான நேரம் முடிந்துவிட்டது. தற்போது கிடைக்கும் சலுகைகளைப் பார்க்க பதிவு பக்கத்திற்குச் செல்கிறோம்...'

          : 'This offer has expired. Taking you to the available offers...',

        false

      );


      setTimeout(() => {

        window.location.href =
          'pournami.html#booking';

      }, 2500);

    }

  };



  /* ---------------------------------
     Run immediately
  --------------------------------- */

  tick();



  /* ---------------------------------
     Continue every 500ms
  --------------------------------- */

  timer =
    setInterval(
      tick,
      500
    );

}



/* =========================================
   CREATE RAZORPAY ORDER
========================================= */

async function createOrder() {


  const payBtn =
    document.getElementById('payBtn');


  if (payBtn) {

    payBtn.disabled = true;

  }



  try {


    /* ---------------------------------
       API URL
    --------------------------------- */

    const url =
      `${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/create-meditation-order`;



    /* ---------------------------------
       Create order
    --------------------------------- */

    const response =
      await fetch(

        url,

        {

          method: 'POST',


          headers: {

            'Content-Type':
              'application/json',

            'apikey':
              MEDITATION_CONFIG.SUPABASE_ANON_KEY,

            'Authorization':
              `Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`

          },


          body:
            JSON.stringify({

              booking_id:
                booking.id

            })

        }

      );



    /* ---------------------------------
       Response
    --------------------------------- */

    const data =
      await response.json();



    /* ---------------------------------
       Validate response
    --------------------------------- */

    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(

        data.error ||
        'Unable to create payment order'

      );

    }



    /* =================================
       RAZORPAY OPTIONS
    ================================= */

    const options = {


      key:

        data.key_id ||
        MEDITATION_CONFIG.RAZORPAY_KEY_ID,


      amount:
        data.amount,


      currency:
        data.currency,


      name:
        'Arithuyil Arivom',


      description:

        booking.program?.title_en ||
        'Pournami Dhyanam',


      order_id:
        data.order_id,



      /* ---------------------------------
         Customer details
      --------------------------------- */

      prefill: {

        name:
          booking.name,

        contact:
          booking.mobile,

        email:
          booking.email ||
          undefined

      },



      /* ---------------------------------
         Theme
      --------------------------------- */

      theme: {

        color:
          '#d9ad48'

      },



      /* ---------------------------------
         Payment success
      --------------------------------- */

      handler:

        async function (
          razorpayResponse
        ) {

          await verify(
            razorpayResponse
          );

        }

    };



    /* ---------------------------------
       Open Razorpay
    --------------------------------- */

    const razorpay =
      new Razorpay(options);


    razorpay.open();



    /* ---------------------------------
       Re-enable button
       if Razorpay opens successfully
    --------------------------------- */

    if (payBtn) {

      payBtn.disabled = false;

    }



  } catch (error) {


    console.error(
      'Create order error:',
      error
    );


    show(

      error.message ||
      'Unable to create payment order',

      false

    );


    if (payBtn) {

      payBtn.disabled = false;

    }

  }

}



/* =========================================
   VERIFY PAYMENT
========================================= */

async function verify(response) {


  try {


    /* =================================
       STEP 1
       Verify Razorpay payment
    ================================= */

    const verifyResponse =
      await fetch(

        `${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/verify-meditation-payment`,

        {

          method: 'POST',


          headers: {

            'Content-Type':
              'application/json',

            'apikey':
              MEDITATION_CONFIG.SUPABASE_ANON_KEY,

            'Authorization':
              `Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`

          },


          body:
            JSON.stringify({

              booking_id:
                booking.id,

              razorpay_order_id:
                response.razorpay_order_id,

              razorpay_payment_id:
                response.razorpay_payment_id,

              razorpay_signature:
                response.razorpay_signature

            })

        }

      );



    const verifyData =
      await verifyResponse.json();



    if (
      !verifyResponse.ok ||
      !verifyData.success
    ) {

      throw new Error(

        verifyData.error ||
        'Payment verification failed'

      );

    }



    /* =================================
       STEP 2
       Create / attach member account
    ================================= */

    const accountResponse =
      await fetch(

        `${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/meditation-api?action=create-member`,

        {

          method: 'POST',


          headers: {

            'Content-Type':
              'application/json',

            'apikey':
              MEDITATION_CONFIG.SUPABASE_ANON_KEY,

            'Authorization':
              `Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`

          },


          body:
            JSON.stringify({

              booking_id:
                booking.id

            })

        }

      );



    const accountData =
      await accountResponse.json();



    if (
      !accountResponse.ok ||
      !accountData.success
    ) {

      throw new Error(

        accountData.error ||
        'Account creation failed'

      );

    }



    /* =================================
       STEP 3
       Save mobile locally
    ================================= */

    localStorage.setItem(

      'aa_member_mobile',

      accountData.mobile ||
      booking.mobile

    );



    /* =================================
       STEP 4
       NEW MEMBER
       Password returned
    ================================= */

    if (accountData.password) {


      /* ---------------------------------
         Show login details once
      --------------------------------- */

      alert(

        currentLang === 'ta'

          ? `உங்கள் உறுப்பினர் கணக்கு வெற்றிகரமாக உருவாக்கப்பட்டது.

மொபைல்: ${accountData.mobile}

கடவுச்சொல்: ${accountData.password}

இந்த கடவுச்சொல்லை பாதுகாப்பாக வைத்துக் கொள்ளுங்கள்.`

          : `Your member account has been created successfully.

Mobile: ${accountData.mobile}

Password: ${accountData.password}

Please keep this password safe.`

      );



      /* =================================
         STEP 5
         AUTO LOGIN
      ================================= */

      const memberEmail =
        `${accountData.mobile}@member.arithuyilarivom.com`;



      const {
        data: loginData,
        error: loginError
      } =
        await sb.auth.signInWithPassword({

          email:
            memberEmail,

          password:
            accountData.password

        });



      /* ---------------------------------
         Auto login failed
      --------------------------------- */

      if (loginError) {


        console.error(

          'Auto login failed:',

          loginError

        );


        alert(

          currentLang === 'ta'

            ? 'உங்கள் account வெற்றிகரமாக உருவாக்கப்பட்டது. Automatic login முடியவில்லை. Login page-க்கு செல்கிறோம்.'

            : 'Your account was created successfully. Automatic login could not be completed. We will take you to the login page.'

        );


        window.location.href =
          'member-login.html?paid=1';


        return;

      }



      /* ---------------------------------
         Auto login successful
      --------------------------------- */

      console.log(

        'Member auto login successful:',

        loginData?.user?.id

      );


      window.location.href =
        'member-dashboard.html';


      return;

    }



    /* =================================
       EXISTING MEMBER
    ================================= */

    alert(

      currentLang === 'ta'

        ? 'Payment வெற்றிகரமாக முடிந்தது. உங்கள் member account ஏற்கனவே உள்ளது. தயவுசெய்து login செய்யுங்கள்.'

        : 'Payment successful. Your member account already exists. Please login.'

    );


    window.location.href =
      'member-login.html?paid=1';


    return;



  } catch (error) {


    /* =================================
       PAYMENT / ACCOUNT ERROR
    ================================= */

    console.error(

      'Payment / account error:',

      error

    );


    show(

      error.message ||
      'Something went wrong',

      false

    );

  }

}



/* =========================================
   LANGUAGE
========================================= */

setLang(
  currentLang
);



/* =========================================
   START
========================================= */

init();


</script>


</body>

</html>
