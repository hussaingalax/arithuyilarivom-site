<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete Booking</title><link rel="stylesheet" href="styles.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script></head><body><header class="topbar"><div class="container topbar-inner"><div class="brand" data-i18n="brand">Arithuyil Arivom</div><div class="lang"><button data-lang="en">EN</button><button data-lang="ta">தமிழ்</button></div></div></header><main class="dashboard"><div class="container"><div class="two-col"><div class="card"><h1 data-i18n="payment">Continue to Payment</h1><div id="summary" class="muted"></div><div class="countdown-bar"><div data-i18n="timer">Offer Timer</div><div id="timer" class="timer">05:00</div></div><button id="payBtn" class="cta full" style="margin-top:14px" data-i18n="payment">Continue to Payment</button><div id="msg"></div></div><div class="card"><h3>Important</h3><p class="muted">Your selected offer is held temporarily. Payment must be completed before the reservation expires.</p></div></div></div></main><script>
const sb=window.supabase.createClient(MEDITATION_CONFIG.SUPABASE_URL,MEDITATION_CONFIG.SUPABASE_ANON_KEY);const bookingId=new URLSearchParams(location.search).get('booking');let booking=null,timer;
async function init(){if(!bookingId){show('Invalid booking.',false);return}const {data,error}=await sb.rpc('get_meditation_booking',{p_booking_id:bookingId});if(error||!data){show('Booking not found.',false);return}booking=data;document.getElementById('summary').innerHTML=`<strong>${data.meditation_programs.title_en}</strong><br>${data.mode==='online'?'Online • Zoom':'Live • Adambakkam Centre'}<br><span class="price">₹${data.offer_price}</span>`;startTimer(new Date(data.reservation_expires_at).getTime());document.getElementById('payBtn').onclick=createOrder}
function show(msg,ok=true){document.getElementById('msg').innerHTML=`<div class="status ${ok?'success':'error'}">${msg}</div>`}
function startTimer(end){clearInterval(timer);const tick=()=>{let s=Math.max(0,Math.floor((end-Date.now())/1000));document.getElementById('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(s<=0){clearInterval(timer);document.getElementById('payBtn').disabled=true;show(currentLang==='ta'?'Offer காலாவதியானது':'Offer expired',false)}};tick();timer=setInterval(tick,500)}
async function createOrder(){document.getElementById('payBtn').disabled=true;try{const url=`${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/create-meditation-order`;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':MEDITATION_CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`},body:JSON.stringify({booking_id:booking.id})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Unable to create payment order');const options={key:d.key_id||MEDITATION_CONFIG.RAZORPAY_KEY_ID,amount:d.amount,currency:d.currency,name:'Arithuyil Arivom',description:booking.meditation_programs.title_en,order_id:d.order_id,prefill:{name:booking.name,contact:booking.mobile,email:booking.email||undefined},theme:{color:'#d9ad48'},handler:async response=>{await verify(response)}};new Razorpay(options).open();document.getElementById('payBtn').disabled=false}catch(e){show(e.message,false);document.getElementById('payBtn').disabled=false}}
async function verify(response){try{const r=await fetch(`${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/verify-meditation-payment`,{method:'POST',headers:{'Content-Type':'application/json','apikey':MEDITATION_CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`},body:JSON.stringify({booking_id:booking.id,razorpay_order_id:response.razorpay_order_id,razorpay_payment_id:response.razorpay_payment_id,razorpay_signature:response.razorpay_signature})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Payment verification failed');const ar=await fetch(`${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/create-member-account`,{method:'POST',headers:{'Content-Type':'application/json','apikey':MEDITATION_CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`},body:JSON.stringify({booking_id:booking.id})});const ad=await ar.json();if(!ar.ok||!ad.success)throw new Error(ad.error||'Account creation failed');localStorage.setItem('aa_member_mobile',ad.mobile||booking.mobile);if(ad.password){alert(`${currentLang==='ta'?'உங்கள் Login விவரங்கள்':'Your login details'}\nMobile: ${ad.mobile}\nPassword: ${ad.password}\n\n${currentLang==='ta'?'இந்த password-ஐ note செய்து OK அழுத்துங்கள்.':'Please note this password and press OK.'}`)}location.href='member-login.html?paid=1'}catch(e){show(e.message,false)}}
setLang(currentLang);init();
</script></body></html>
