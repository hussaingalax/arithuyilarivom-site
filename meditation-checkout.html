<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Complete Booking</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
</head>

<body>

<header class="topbar">
  <div class="container topbar-inner">

    <div class="brand" data-i18n="brand">
      Arithuyil Arivom
    </div>

    <div class="lang">
      <button data-lang="en">EN</button>
      <button data-lang="ta">தமிழ்</button>
    </div>

  </div>
</header>


<main class="dashboard">

  <div class="container">

    <div class="two-col">

      <!-- PAYMENT CARD -->
      <div class="card">

        <h1 data-i18n="payment">
          Continue to Payment
        </h1>

        <div id="summary" class="muted"></div>

        <div class="countdown-bar">

          <div data-i18n="timer">
            Offer Timer
          </div>

          <div id="timer" class="timer">
            05:00
          </div>

        </div>

        <button
          id="payBtn"
          class="cta full"
          style="margin-top:14px"
          data-i18n="payment"
        >
          Continue to Payment
        </button>

        <div id="msg"></div>

      </div>


      <!-- IMPORTANT -->
      <div class="card">

        <h2 data-i18n="important">
  Important
</h2>

<p data-i18n="holdMessage">
  Your selected offer is held temporarily. Payment must be completed before the reservation expires.
</p>

      </div>

    </div>

  </div>

</main>


<script>

const sb = window.supabase.createClient(
  MEDITATION_CONFIG.SUPABASE_URL,
  MEDITATION_CONFIG.SUPABASE_ANON_KEY
);

const bookingId =
  new URLSearchParams(location.search).get('booking');

let booking = null;
let timer = null;


/* ---------------------------------
   SHOW MESSAGE
--------------------------------- */

function show(msg, ok = true) {

  document.getElementById('msg').innerHTML = `
    <div class="status ${ok ? 'success' : 'error'}">
      ${msg}
    </div>
  `;

}


/* ---------------------------------
   LOAD BOOKING
--------------------------------- */

async function init() {

  if (!bookingId) {

    show(
      currentLang === 'ta'
        ? 'செல்லுபடியாகும் பதிவு கிடைக்கவில்லை.'
        : 'Invalid booking.',
      false
    );

    return;
  }


  const { data, error } = await sb.rpc(
    'get_meditation_booking',
    {
      p_booking_id: bookingId
    }
  );


  if (error || !data) {

    console.error('Booking load error:', error);

    show(
      currentLang === 'ta'
        ? 'பதிவு கிடைக்கவில்லை.'
        : 'Booking not found.',
      false
    );

    return;
  }


  booking = data;


  const programTitle =
    currentLang === 'ta'
      ? (data.program?.title_ta || data.program?.title_en)
      : data.program?.title_en;


  const modeText =
    data.mode === 'online'
      ? (
          currentLang === 'ta'
            ? 'ஆன்லைன் • Zoom'
            : 'Online • Zoom'
        )
      : (
          currentLang === 'ta'
            ? 'நேரடி வகுப்பு • ஆதம்பாக்கம் மையம்'
            : 'Live • Adambakkam Centre'
        );


  document.getElementById('summary').innerHTML = `
    <strong>${programTitle || ''}</strong>
    <br>
    ${modeText}
    <br>
    <span class="price">₹${data.offer_price}</span>
  `;


  const expiry =
    new Date(data.reservation_expires_at).getTime();


  startTimer(expiry);


  document.getElementById('payBtn').onclick =
    createOrder;

}


/* ---------------------------------
   TIMER
--------------------------------- */

function startTimer(end) {

  clearInterval(timer);


  const tick = () => {

    const seconds = Math.max(
      0,
      Math.floor((end - Date.now()) / 1000)
    );


    document.getElementById('timer').textContent =
      `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;


    if (seconds <= 0) {

      clearInterval(timer);


      document.getElementById('payBtn').disabled =
        true;


      show(
        currentLang === 'ta'
          ? 'இந்த சலுகைக்கான நேரம் முடிந்துவிட்டது. தற்போது கிடைக்கும் சலுகைகளைப் பார்க்க பதிவு பக்கத்திற்குச் செல்கிறோம்...'
          : 'This offer has expired. Taking you to the available offers...',
        false
      );


      setTimeout(() => {

        window.location.href =
          'pournami.html#booking';

      }, 2500);

    }

  };


  tick();

  timer = setInterval(tick, 500);

}


/* ---------------------------------
   CREATE RAZORPAY ORDER
--------------------------------- */

async function createOrder() {

  document.getElementById('payBtn').disabled =
    true;


  try {

    const url =
      `${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/create-meditation-order`;


    const response = await fetch(
      url,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json',
          'apikey':
            MEDITATION_CONFIG.SUPABASE_ANON_KEY,
          'Authorization':
            `Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`
        },

        body: JSON.stringify({
          booking_id: booking.id
        })
      }
    );


    const data = await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        'Unable to create payment order'
      );

    }


    const options = {

      key:
        data.key_id ||
        MEDITATION_CONFIG.RAZORPAY_KEY_ID,

      amount:
        data.amount,

      currency:
        data.currency,

      name:
        'Arithuyil Arivom',

      description:
        booking.program?.title_en ||
        'Pournami Dhyanam',

      order_id:
        data.order_id,

      prefill: {

        name:
          booking.name,

        contact:
          booking.mobile,

        email:
          booking.email ||
          undefined

      },

      theme: {
        color: '#d9ad48'
      },


      handler:
        async function (razorpayResponse) {

          await verify(razorpayResponse);

        }

    };


    const razorpay =
      new Razorpay(options);


    razorpay.open();


    document.getElementById('payBtn').disabled =
      false;


  } catch (error) {

    console.error(
      'Create order error:',
      error
    );


    show(
      error.message ||
      'Unable to create payment order',
      false
    );


    document.getElementById('payBtn').disabled =
      false;

  }

}


/* ---------------------------------
   VERIFY PAYMENT
--------------------------------- */

async function verify(response) {

  try {

    /* STEP 1
       Verify Razorpay payment
    */

    const verifyResponse =
      await fetch(
        `${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/verify-meditation-payment`,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json',

            'apikey':
              MEDITATION_CONFIG.SUPABASE_ANON_KEY,

            'Authorization':
              `Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`
          },

          body: JSON.stringify({

            booking_id:
              booking.id,

            razorpay_order_id:
              response.razorpay_order_id,

            razorpay_payment_id:
              response.razorpay_payment_id,

            razorpay_signature:
              response.razorpay_signature

          })
        }
      );


    const verifyData =
      await verifyResponse.json();


    if (
      !verifyResponse.ok ||
      !verifyData.success
    ) {

      throw new Error(
        verifyData.error ||
        'Payment verification failed'
      );

    }


    /* STEP 2
       Create / attach member account
    */

    const accountResponse =
      await fetch(
        `${MEDITATION_CONFIG.SUPABASE_URL}/functions/v1/meditation-api?action=create-member`,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json',

            'apikey':
              MEDITATION_CONFIG.SUPABASE_ANON_KEY,

            'Authorization':
              `Bearer ${MEDITATION_CONFIG.SUPABASE_ANON_KEY}`
          },

          body: JSON.stringify({

            booking_id:
              booking.id

          })
        }
      );


    const accountData =
      await accountResponse.json();


    if (
      !accountResponse.ok ||
      !accountData.success
    ) {

      throw new Error(
        accountData.error ||
        'Account creation failed'
      );

    }


    /* STEP 3
       Save mobile locally
    */

    localStorage.setItem(
      'aa_member_mobile',
      accountData.mobile ||
      booking.mobile
    );


    /* STEP 4
       Show password if newly created
    */

    if (accountData.password) {

      alert(

        currentLang === 'ta'

          ? `உங்கள் உறுப்பினர் உள்நுழைவு விவரங்கள்

Mobile: ${accountData.mobile}

Password: ${accountData.password}

இந்த password-ஐ note செய்து OK அழுத்துங்கள்.`

          : `Your member login details

Mobile: ${accountData.mobile}

Password: ${accountData.password}

Please note this password and press OK.`

      );

    }


    /* ---------------------------------
   STEP 5
   Auto login new member
--------------------------------- */

if (accountData.password) {

  const memberEmail =
    `${accountData.mobile}@member.arithuyilarivom.com`;

  const {
    data: loginData,
    error: loginError
  } = await sb.auth.signInWithPassword({

    email: memberEmail,

    password: accountData.password

  });

  if (loginError) {

    console.error(
      'Auto login failed:',
      loginError
    );

    /*
      Account was created successfully,
      but automatic login failed.
      Keep the user informed instead of
      silently losing the session.
    */

    alert(

      currentLang === 'ta'

        ? `உங்கள் account வெற்றிகரமாக உருவாக்கப்பட்டது.

Mobile: ${accountData.mobile}

Password: ${accountData.password}

Login page-க்கு செல்கிறோம். இந்த password-ஐ பயன்படுத்தி login செய்யுங்கள்.`

        : `Your account was created successfully.

Mobile: ${accountData.mobile}

Password: ${accountData.password}

We will take you to the login page. Please use this password to login.`

    );

    window.location.href =
      'member-login.html?paid=1';

    return;
  }

  /*
    Auto login successful
  */

  window.location.href =
    'member-dashboard.html';

  return;
}

/* ---------------------------------
   EXISTING MEMBER
--------------------------------- */

alert(

  currentLang === 'ta'

    ? 'Payment வெற்றிகரமாக முடிந்தது. உங்கள் account ஏற்கனவே உள்ளது. தயவுசெய்து login செய்யுங்கள்.'

    : 'Payment successful. Your member account already exists. Please login.'

);

window.location.href =
  'member-login.html?paid=1';

} catch (error) {

  console.error(
    'Payment / account error:',
    error
  );

  show(
    error.message ||
    'Something went wrong',
    false
  );

}
    
/* ---------------------------------
   LANGUAGE
--------------------------------- */

setLang(currentLang);


/* ---------------------------------
   START
--------------------------------- */

init();

</script>

</body>
</html>
